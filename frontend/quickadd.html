<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quick add</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #1D1B18;
      color: #EDE8E1;
      user-select: none;
      overflow: hidden;
    }
    .qa-shell {
      display: flex; align-items: center; gap: 10px;
      width: 100%; height: 100%;
      padding: 0 14px;
      background: #1D1B18;
      border: 1px solid rgba(212, 132, 90, 0.35);
      border-radius: 8px;
    }
    .qa-plus {
      width: 22px; height: 22px;
      border-radius: 5px;
      background: rgba(212, 132, 90, 0.16);
      color: #D4845A;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 600;
      flex-shrink: 0;
      line-height: 0;
    }
    .qa-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #EDE8E1;
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 0.01em;
      user-select: text;
      -webkit-user-select: text;
    }
    .qa-input::placeholder { color: #6A6460; }
    .qa-hint {
      font-size: 9px;
      font-weight: 600;
      color: #4E4A46;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .qa-hint kbd {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      padding: 1px 4px;
      font-family: inherit;
      font-size: 9px;
      color: #8A8480;
      margin-left: 2px;
    }
  </style>
</head>
<body>
  <div class="qa-shell">
    <span class="qa-plus">+</span>
    <input id="qa-input" class="qa-input"
           placeholder="what needs doing?"
           autocomplete="off" spellcheck="false" />
    <span class="qa-hint">enter<kbd>↵</kbd></span>
  </div>
  <script>
    const input = document.getElementById("qa-input");

    function api() { return (window.pywebview && window.pywebview.api) || null; }
    async function call(fn, ...args) {
      const a = api();
      if (!a || !a[fn]) return null;
      try { return await a[fn](...args); } catch (e) { console.error(fn, e); return null; }
    }

    function focusInput() {
      try { input.focus(); input.select(); } catch (_) {}
    }

    // Focus on every relevant event so the user can type immediately
    window.addEventListener("pywebviewready", focusInput);
    window.addEventListener("focus", focusInput);
    setTimeout(focusInput, 50);
    setTimeout(focusInput, 200);

    input.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const v = input.value.trim();
        if (!v) { call("quickadd_cancel"); return; }
        // Disable to prevent double-submit while the request flies
        input.disabled = true;
        await call("quickadd_save", v);
      } else if (e.key === "Escape") {
        e.preventDefault();
        call("quickadd_cancel");
      }
    });
  </script>
</body>
</html>
